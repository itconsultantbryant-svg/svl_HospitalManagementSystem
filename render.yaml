# Render Blueprint: U-HPCMS (Liberia)
# https://docs.render.com/blueprint-spec
# Connect this repo in Render Dashboard → New → Blueprint, then apply.
#
# NOTE: The database is NOT created by this Blueprint. Render's free tier only
# allows ONE free PostgreSQL database per account, so the Blueprint cannot create
# one without colliding with an existing free DB. Instead:
#   1. Create the database manually: Render Dashboard → New → PostgreSQL
#      (name: hms-liberia-db, plan: free) — this is your one allowed free DB.
#   2. Copy its "Internal Database URL" (hms-liberia-db → Info → Internal Database URL).
#   3. After the Blueprint creates the API service, paste that URL into the
#      backend service → Environment → DATABASE_URL. Also set CORS_ORIGIN.
#   4. Redeploy the backend. The postDeployCommand runs init-db-postgres.js
#      automatically on every deploy to create all tables + the super-admin.
#      If you need to re-run it: backend service → Shell → `node scripts/init-db-postgres.js`

services:
  # Backend API (Node.js)
  - type: web
    runtime: node
    name: hms-liberia-api
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    # Auto-initialize the database schema on first deploy and every deploy
    postDeployCommand: node scripts/init-db-postgres.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL
        sync: false
        # PASTE your Postgres Internal Database URL here (from the DB you created manually).
        # Example: postgres://hospital_user:xxx@dpg-xxxx-xxxx-a.oregon-postgres.render.com/hospital
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
        # Set to your frontend URL after first deploy, e.g. https://hms-liberia.onrender.com

  # Frontend (Static Site)
  - type: web
    runtime: static
    name: hms-liberia
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
        # Set to your backend URL after first deploy, e.g. https://hms-liberia-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html