# Render Blueprint: U-HPCMS (Liberia)
# https://docs.render.com/blueprint-spec
# Connect this repo in Render Dashboard → New → Blueprint, then apply.
#
# After first deploy:
#   1. Copy the backend URL (e.g., https://hms-liberia-api.onrender.com)
#   2. Copy the frontend URL (e.g., https://hms-liberia.onrender.com)
#   3. In backend service → Environment: set CORS_ORIGIN=<frontend-url>
#   4. In frontend service → Environment: set VITE_API_URL=<backend-url>
#   5. Redeploy both services (or trigger a manual deploy).
#   6. On first backend deploy, the postDeployCommand runs init-db-postgres.js automatically.
#      If you need to re-run: backend service → Shell → `node scripts/init-db-postgres.js`

databases:
  - name: hms-liberia-db
    databaseName: hospital
    plan: free

services:
  # Backend API (Node.js)
  - type: web
    runtime: node
    name: hms-liberia-api
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    # Auto-initialize the database schema on first deploy and every deploy
    postDeployCommand: node scripts/init-db-postgres.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: hms-liberia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
        # Set to your frontend URL after first deploy, e.g. https://hms-liberia.onrender.com

  # Frontend (Static Site)
  - type: web
    runtime: static
    name: hms-liberia
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
        # Set to your backend URL after first deploy, e.g. https://hms-liberia-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html